name: Continuous Deployment

on:
  workflow_run:
    workflows: ["Code Coverage"]
    types: [completed]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy to Production
    runs-on: [self-hosted, Linux, X64]
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: |
          for attempt in $(seq 1 18); do
            if docker pull ghcr.io/${{ github.repository }}:latest; then
              break
            fi
            echo "Image not published yet, retry $attempt/18..."
            sleep 10
          done

      - name: Deploy
        working-directory: ${{ github.workspace }}
        run: |
          docker compose pull
          docker compose up -d
          docker system prune -f

      - name: Verify
        working-directory: ${{ github.workspace }}
        run: |
          for attempt in $(seq 1 12); do
            if curl -fsS http://localhost:8000/ >/dev/null 2>&1; then
              echo "App is up on http://localhost:8000/"
              exit 0
            fi
            echo "App not ready yet, retry $attempt/12..."
            sleep 5
          done
          echo "App did not become healthy" && exit 1
