name: Continuous Deployment

on:
  workflow_run:
    workflows: ["Code Coverage"]
    types: [completed]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Build image
        run: docker build -t poker:prod .

      - name: Validate container starts
        run: |
          docker run -d --name test-poker -p 8000:8000 poker:prod
          sleep 5
          curl -sf http://localhost:8000/ > /dev/null
          echo "Container validated successfully" >> $GITHUB_STEP_SUMMARY
          docker stop test-poker

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Tag and push image
        run: |
          docker tag poker:prod ghcr.io/${{ github.repository }}:latest
          docker tag poker:prod ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha }}
          docker push ghcr.io/${{ github.repository }}:latest
          docker push ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha }}
          echo "### Docker Image" >> $GITHUB_STEP_SUMMARY
          echo "\`ghcr.io/${{ github.repository }}:latest\`" >> $GITHUB_STEP_SUMMARY

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            docker pull ghcr.io/${{ github.repository }}:latest
            cd /opt/poker && docker compose pull && docker compose up -d
            docker system prune -f
            echo "Deployed $(git -C /opt/poker rev-parse --short HEAD)"
