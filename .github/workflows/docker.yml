name: Docker Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t poker:test .

      - name: Validate container starts
        run: |
          docker run -d --name test-poker -p 8000:8000 poker:test
          sleep 5
          curl -sf http://localhost:8000/ > /dev/null
          echo "Container validated successfully" >> $GITHUB_STEP_SUMMARY
          docker stop test-poker

      - name: Login to GHCR
        if: github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Tag and push image
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag poker:test ghcr.io/${{ github.repository }}:latest
          docker tag poker:test ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}:latest
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}
          echo "### Docker Image" >> $GITHUB_STEP_SUMMARY
          echo "\`ghcr.io/${{ github.repository }}:latest\`" >> $GITHUB_STEP_SUMMARY
