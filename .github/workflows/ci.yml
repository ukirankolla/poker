name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: write

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Compile all modules
        run: python -m compileall -q poker agents simulation web tests

      - name: Smoke imports
        run: |
          python -c "import poker.game, poker.evaluator, poker.equity, poker.statistics"
          python -c "import agents.ollama_agent, agents.learned_agent"
          python -c "import simulation.benchmark, simulation.tournament, simulation.self_play, simulation.train"
          python -c "import web.app"

      - name: Run unit tests
        run: |
          mkdir -p reports
          pytest -m "not integration and not regression" \
            --junitxml=reports/unit.xml -q

      - name: Run integration tests
        run: |
          mkdir -p reports
          pytest -m integration --junitxml=reports/integration.xml -q

      - name: Run regression tests
        run: |
          mkdir -p reports
          pytest -m regression --junitxml=reports/regression.xml -q

      - uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: reports/*.xml
          check_name: "JUnit Tests"
