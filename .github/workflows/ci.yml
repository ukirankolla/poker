name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: write

jobs:
  # ── Stage 1: build verification ──────────────────────────────────────
  build:
    name: Build Pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile all modules
        run: python -m compileall -q poker agents simulation web tests

      - name: Smoke imports
        run: |
          python -c "import poker.game, poker.evaluator, poker.equity, poker.statistics"
          python -c "import agents.ollama_agent, agents.learned_agent"
          python -c "import simulation.benchmark, simulation.tournament, simulation.self_play, simulation.train"
          python -c "import web.app"

  # ── Stage 2: unit tests (matrix) ─────────────────────────────────────
  unit-tests:
    name: "Unit Tests (Python ${{ matrix.python-version }})"
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run unit tests
        run: |
          mkdir -p reports
          pytest -m "not integration and not regression" \
            --junitxml=reports/unit.xml -q

      - uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: reports/unit.xml
          check_name: "JUnit Unit Tests (Python ${{ matrix.python-version }})"

  # ── Stage 2: integration tests ───────────────────────────────────────
  integration-tests:
    name: Integration Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run integration tests
        run: |
          mkdir -p reports
          pytest -m integration --junitxml=reports/integration.xml -q

      - uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: reports/integration.xml
          check_name: "JUnit Integration Tests"

  # ── Stage 2: regression tests ────────────────────────────────────────
  regression-tests:
    name: Regression Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run regression tests
        run: |
          mkdir -p reports
          pytest -m regression --junitxml=reports/regression.xml -q

      - uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: reports/regression.xml
          check_name: "JUnit Regression Tests"

  # ── Stage 3: code coverage ───────────────────────────────────────────
  coverage:
    name: Code Coverage
    needs: [unit-tests, integration-tests, regression-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run coverage
        run: |
          mkdir -p reports
          pytest --cov=poker --cov=agents --cov=simulation --cov=web \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=html:reports/coverage-html \
            --cov-report=term

      - name: Coverage summary
        run: |
          COVERAGE=$(python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('reports/coverage.xml')
          print(float(tree.getroot().attrib['line-rate']) * 100)
          ")
          echo "### Coverage: ${COVERAGE}%" >> $GITHUB_STEP_SUMMARY

      - uses: codecov/codecov-action@v4
        with:
          files: reports/coverage.xml
          fail_ci_if_error: false

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: reports/coverage-html/

  # ── Stage 4: Docker build + validate ─────────────────────────────────
  docker:
    name: Docker Build
    needs: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t poker:test .

      - name: Validate container starts
        run: |
          docker run -d --name test-poker -p 8000:8000 poker:test
          sleep 5
          curl -sf http://localhost:8000/ > /dev/null
          echo "Container validated successfully" >> $GITHUB_STEP_SUMMARY
          docker stop test-poker

      - name: Login to GHCR
        if: github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Tag and push image
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag poker:test ghcr.io/${{ github.repository }}:latest
          docker tag poker:test ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}:latest
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}
          echo "### Docker Image" >> $GITHUB_STEP_SUMMARY
          echo "\`ghcr.io/${{ github.repository }}:latest\`" >> $GITHUB_STEP_SUMMARY
