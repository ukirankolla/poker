[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-poker"
version = "0.1.0"
description = "Texas Hold'em engine and local AI poker agents"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ai = ["requests>=2.31"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["poker*", "agents*", "simulation*"]
